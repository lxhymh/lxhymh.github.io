<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>红岸·主页</title>
    <link rel="icon" type="image/png" href="https://bee-oss-ab.imglnk.cn/u/20260827/0f430c340293a62054d2800aaeb0c475.png" />
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css" />
    
    <!-- 隐藏的SVG滤镜：制造水流涌动特效 -->
    <svg width="0" height="0" style="position:absolute;">
        <filter id="water-wave">
            <feTurbulence type="fractalNoise" baseFrequency="0.01 0.015" numOctaves="2" result="noise">
                <animate attributeName="baseFrequency" dur="12s" values="0.01 0.015;0.015 0.01;0.01 0.015" repeatCount="indefinite" />
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: "LXGW WenKai", "霞鹜文楷", "Kaiti SC", sans-serif;
            font-weight: 600; 
            color: #ffffff; 
            line-height: 1.5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            transition: opacity 0.4s ease;
        }
        body.fade-out { opacity: 0; }

        .bg-pixel-art {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: url('https://bee-oss-ab.imglnk.cn/u/20260827/e8c96f04b38602ff1f99af7791b3bb0c.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            /* 应用水波滤镜 */
            filter: url(#water-wave);
        }

        .container {
            max-width: 640px;
            width: 100%;
            max-height: 95vh;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 2.5rem 1.5rem;
            background: rgba(0, 0, 0, 0.35); 
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .name {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            text-align: center;
            margin-bottom: 2rem;
        }

        .bio {
            font-size: 1rem;
            font-weight: 700;
            text-align: center;
            max-width: 480px;
            margin: 0 auto 2rem auto;
            border: none;
            padding: 0 0.25rem;
        }

        .bio p { margin-bottom: 0.6rem; }
        .bio p:last-child { margin-bottom: 0; }

        .divider {
            width: 40px;
            height: 2px;
            background: rgba(255, 255, 255, 0.8);
            margin: 0 auto 2rem auto;
            border: none;
        }

        .nav-label {
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 1.2rem;
        }

        .nav-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
        }

        .nav-link {
            display: block;
            width: calc(50% - 0.3rem); 
            padding: 0.8rem 0.5rem;
            text-align: center;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.6);
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: background 0.15s ease, color 0.15s ease;
            letter-spacing: 0.02em;
        }

        .nav-link:hover,
        .nav-link:focus {
            background: #ffffff; 
            color: #000000;
            border-color: #ffffff;
        }

        .footer {
            margin-top: 2rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            text-align: center;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .footer a {
            color: #ffffff;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .footer a:hover {
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="bg-pixel-art"></div>

    <div class="container">

        <h1 class="name">红 岸</h1>

        <div class="bio">
            <p>一个生存在互联网边缘的青年，会点编程，会点设计，</p>
            <p>会点泡妞，人生已经趋近于完美，就是没有钱。</p>
        </div>

        <div class="divider" aria-hidden="true"></div>

        <div class="nav-label">作品 &amp; 足迹</div>
        <div class="nav-grid">
            <a href="#" class="nav-link">博客（无限期施工中🚧...）</a>
            <a href="projects.html" class="nav-link" data-transition>项目</a>
            <a href="about.html" class="nav-link" data-transition>关于</a>
        </div>

        <div class="footer">
            <span>© 2026 红岸 · </span>
            <a href="https://space.bilibili.com/2019416471?spm_id_from=333.1007.0.0">Bilibili</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('a[data-transition]').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    document.body.classList.add('fade-out');
                    setTimeout(() => { window.location.href = link.href; }, 400);
                });
            });
        });
    </script>
</body>
</html>
