<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>红岸·项目总结</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css" />
    
    <!-- 隐藏的SVG滤镜 -->
    <svg width="0" height="0" style="position:absolute;">
        <filter id="water-wave">
            <feTurbulence type="fractalNoise" baseFrequency="0.01 0.015" numOctaves="2" result="noise">
                <animate attributeName="baseFrequency" dur="12s" values="0.01 0.015;0.015 0.01;0.01 0.015" repeatCount="indefinite" />
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: "LXGW WenKai", "霞鹜文楷", "Kaiti SC", sans-serif;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            transition: opacity 0.4s ease;
        }
        body.fade-out { opacity: 0; }

        .bg-pixel-art {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: url('https://bee-oss-ab.imglnk.cn/u/20260827/e8c96f04b38602ff1f99af7791b3bb0c.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: url(#water-wave);
        }

        .container {
            max-width: 640px;
            width: 100%;
            max-height: 95vh;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 2.5rem 1.5rem;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        h1, .divider, .project-list, .nav-grid, .footer {
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
        }

        .name {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            text-align: center;
            margin-bottom: 2rem;
            animation-delay: 0.2s;
        }

        .divider {
            width: 40px;
            height: 2px;
            background: rgba(255, 255, 255, 0.8);
            margin: 0 auto 2rem auto;
            border: none;
            animation-delay: 0.5s;
        }

        .project-list {
            margin-bottom: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            animation-delay: 0.8s;
        }

        .project-item {
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 1rem 1.2rem;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .project-item:hover {
            background: rgba(255, 255, 255, 0.9);
            color: #000000;
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.4rem;
        }

        .project-title {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.02em;
        }

        .project-year {
            font-size: 0.8rem;
            font-weight: 600;
            opacity: 0.8;
        }

        .project-desc {
            font-size: 0.9rem;
            line-height: 1.6;
            opacity: 0.9;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: 1fr;
            max-width: 240px;
            margin: 0 auto;
            gap: 0.6rem;
            animation-delay: 1.1s;
        }

        .nav-link {
            display: block;
            padding: 0.8rem 0.5rem;
            text-align: center;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.6);
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: background 0.2s ease, color 0.2s ease;
            letter-spacing: 0.02em;
        }

        .nav-link:hover,
        .nav-link:focus {
            background: #ffffff; 
            color: #000000;
            border-color: #ffffff;
        }

        .footer {
            margin-top: 2rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            text-align: center;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            animation-delay: 1.4s;
        }

        .footer a {
            color: #ffffff;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .footer a:hover {
            text-decoration: none;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="bg-pixel-art"></div>

    <div class="container">
        <h1 class="name">项目总结</h1>
        <div class="divider" aria-hidden="true"></div>

        <div class="project-list">
            <div class="project-item">
                <div class="project-header">
                    <span class="project-title">边缘生活博客</span>
                    <span class="project-year">2026</span>
                </div>
                <p class="project-desc">记录生存在互联网边缘的日常，包含技术心得与各类生活杂谈，极简黑白设计。</p>
            </div>
            <div class="project-item">
                <div class="project-header">
                    <span class="project-title">完美人设设计系统</span>
                    <span class="project-year">2025</span>
                </div>
                <p class="project-desc">包含“会点编程、会点设计、会点泡妞”的理论体系构建，虽然没钱，但人文关怀拉满。</p>
            </div>
            <div class="project-item">
                <div class="project-header">
                    <span class="project-title">B站个人站点引擎</span>
                    <span class="project-year">2024</span>
                </div>
                <p class="project-desc">结合霞鹜文楷字体与毛玻璃效果，打造高度舒适的展示型主页，无翻页，纯静态。</p>
            </div>
        </div>

        <div class="nav-grid">
            <a href="index.html" class="nav-link" data-transition>返回主页</a>
        </div>

        <div class="footer">
            <span>© 2026 红岸 · </span>
            <a href="https://space.bilibili.com/2019416471?spm_id_from=333.1007.0.0">Bilibili</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('a[data-transition]').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    document.body.classList.add('fade-out');
                    setTimeout(() => { window.location.href = link.href; }, 400);
                });
            });
        });
    </script>
</body>
</html>
